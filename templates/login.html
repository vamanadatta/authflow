{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card animate-slide-up">
        <!-- Card Header -->
        <div class="card-header text-center">
            <div class="card-badge-icon">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h1 class="card-title">Welcome Back</h1>
            <p class="card-subtitle">Sign in with your credentials to access your account</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm" novalidate>
            <!-- Username or Email -->
            <div class="form-group">
                <label for="identifier" class="form-label">Username or Email</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-user"></i></span>
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        class="form-control" 
                        placeholder="e.g. alexander or alex@example.com" 
                        value="{{ identifier or '' }}" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <div class="label-row">
                    <label for="password" class="form-label">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control password-field" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me -->
            <div class="form-row justify-between">
                <label class="custom-checkbox">
                    <input type="checkbox" name="remember_me" id="rememberMe">
                    <span class="checkbox-indicator"></span>
                    <span class="checkbox-label">Remember me for 30 days</span>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <!-- Social Logins Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login-grid">
                <button type="button" class="btn-social" onclick="simulateSocialLogin('Google')">
                    <i class="fa-brands fa-google"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social" onclick="simulateSocialLogin('GitHub')">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </button>
            </div>
        </form>

        <!-- Card Footer -->
        <div class="card-footer text-center">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="primary-link">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
