{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card animate-slide-up">
        <!-- Card Header -->
        <div class="card-header text-center">
            <div class="card-badge-icon">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="card-title">Reset Password</h1>
            <p class="card-subtitle">
                {% if user_email %}
                    Resetting password for <strong>{{ user_email }}</strong>
                {% else %}
                    Create a strong new password for your account
                {% endif %}
            </p>
        </div>

        <!-- Reset Password Form -->
        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form" id="resetPasswordForm">
            <!-- New Password -->
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control password-field" 
                        placeholder="At least 6 characters" 
                        required 
                        autocomplete="new-password"
                        autofocus
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                
                <!-- Password Strength Meter -->
                <div class="password-meter-container" id="passwordMeter">
                    <div class="meter-bars">
                        <span class="meter-bar" id="bar1"></span>
                        <span class="meter-bar" id="bar2"></span>
                        <span class="meter-bar" id="bar3"></span>
                        <span class="meter-bar" id="bar4"></span>
                    </div>
                    <span class="meter-text" id="meterText">Password strength</span>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-shield-check"></i></span>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control password-field" 
                        placeholder="Re-enter your new password" 
                        required 
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="match-indicator" id="matchIndicator"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">
                <span>Update Password</span>
                <i class="fa-solid fa-check"></i>
            </button>
        </form>

        <!-- Card Footer -->
        <div class="card-footer text-center">
            <p><a href="{{ url_for('login') }}" class="primary-link"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
