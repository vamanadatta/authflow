{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card animate-slide-up">
        <!-- Card Header -->
        <div class="card-header text-center">
            <div class="card-badge-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="card-title">Create Account</h1>
            <p class="card-subtitle">Join us today to get started with full platform access</p>
        </div>

        <!-- Register Form -->
        <form method="POST" action="{{ url_for('register') }}" class="auth-form" id="registerForm">
            <!-- Full Name -->
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-id-badge"></i></span>
                    <input 
                        type="text" 
                        id="full_name" 
                        name="full_name" 
                        class="form-control" 
                        placeholder="e.g. John Doe" 
                        value="{{ full_name or '' }}" 
                        required 
                        autocomplete="name"
                        autofocus
                    >
                </div>
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-user"></i></span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="e.g. johndoe" 
                        value="{{ username or '' }}" 
                        required 
                        autocomplete="username"
                    >
                </div>
                <span class="field-hint">Must be at least 3 characters.</span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="e.g. john@example.com" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control password-field" 
                        placeholder="At least 6 characters" 
                        required 
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                
                <!-- Password Strength Meter -->
                <div class="password-meter-container" id="passwordMeter">
                    <div class="meter-bars">
                        <span class="meter-bar" id="bar1"></span>
                        <span class="meter-bar" id="bar2"></span>
                        <span class="meter-bar" id="bar3"></span>
                        <span class="meter-bar" id="bar4"></span>
                    </div>
                    <span class="meter-text" id="meterText">Password strength</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fa-solid fa-shield-check"></i></span>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control password-field" 
                        placeholder="Re-enter your password" 
                        required 
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="match-indicator" id="matchIndicator"></div>
            </div>

            <!-- Terms & Conditions -->
            <div class="form-group">
                <label class="custom-checkbox">
                    <input type="checkbox" id="termsCheck" required checked>
                    <span class="checkbox-indicator"></span>
                    <span class="checkbox-label">I agree to the <a href="#" class="primary-link" onclick="alert('Terms & Conditions: By creating an account, you agree to keep your credentials secure.'); return false;">Terms of Service</a> & <a href="#" class="primary-link" onclick="alert('Privacy Policy: Your personal data and password hash are securely stored.'); return false;">Privacy Policy</a></span>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block" id="submitRegisterBtn">
                <span>Create Account</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Card Footer -->
        <div class="card-footer text-center">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="primary-link">Sign in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
